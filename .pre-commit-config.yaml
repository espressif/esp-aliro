repos:
  - repo: https://github.com/google/keep-sorted.git
    rev: v0.8.0
    hooks:
      - id: keep-sorted

  - repo: https://github.com/espressif/check-copyright
    rev: v1.1.1
    hooks:
      - id: check-copyright
        args: [--config, .check-copyright.yaml]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v19.1.2
    hooks:
      - id: clang-format
        files: \.(c|cc|cpp|cxx|h|hh|hpp|hxx)$

  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.2
    hooks:
      - id: check-gitlab-ci
        files: ^(\.gitlab-ci\.ya?ml|\.gitlab/.*\.ya?ml)$

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [markdown, yaml]

  - repo: local
    hooks:
      - id: check-document-validation-time
        name: Check document fixture validation time
        entry: python3 examples/aliro_reader/check_document_validation_time.py
        language: system
        always_run: true
        pass_filenames: false
